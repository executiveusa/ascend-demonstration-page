name: Apply approved onboarding copy edits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-copy-edits.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply only the approved changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_intro = "Hello Otha and Elisha, we spoke earlier about the Facebook block and discussed creating it from your other account as you mentioned. I spoke with my team and they said yes, you are able to do that and that it's much better that way.  I know social media can be frustrating and your busy so we wrote this up for you as a guide. If there is any questions we will work together until its solved"
          new_intro = "Hello Otha and Elisha, we spoke earlier about the Facebook block and discussed creating the Page from your other Facebook account, just as you mentioned. I spoke with my team, and they agreed that you can absolutely do that—and that it's the better approach. I know social media can be frustrating, and I know you're both busy, so we put together this guide to make the process as simple as possible. If you have any questions along the way, we'll work through them together until everything is up and running."

          old_font = ".hero p{max-width:940px;font-size:clamp(1rem,1.8vw,1.25rem);color:#d0d5dd}"
          new_font = ".hero p{max-width:940px;font-size:clamp(1.125rem,2vw,1.4rem);color:#d0d5dd}"

          old_heading = "3. Before Creating the Page"
          new_heading = "3. Before Creating Your ASC3ND Facebook Page"

          checks = {
              'introduction': old_intro,
              'introduction font rule': old_font,
              'section 3 heading': old_heading,
          }
          missing = [name for name, value in checks.items() if value not in text]
          if missing:
              raise SystemExit(f"Stopped without editing. Expected text not found: {', '.join(missing)}")

          text = text.replace(old_intro, new_intro, 1)
          text = text.replace(old_font, new_font, 1)
          text = text.replace(old_heading, new_heading)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove this one-time workflow
        run: rm .github/workflows/apply-approved-copy-edits.yml

      - name: Commit exact approved edits
        run: |
          git config user.name "ASC3ND Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-approved-copy-edits.yml
          git commit -m "Update onboarding introduction and section 3 heading"
          git push

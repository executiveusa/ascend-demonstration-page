name: Publish final ASC3ND onboarding
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-final-onboarding.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write final standalone HTML
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          open('index.html','wb').write(gzip.decompress(base64.b64decode(payload)))
          PY
      - name: Validate final HTML
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          s=Path('index.html').read_text()
          HTMLParser().feed(s)
          assert s.lstrip().lower().startswith('<!doctype html>')
          assert 'fetch(' not in s
          assert s.count('class="slide"') == 16
          assert 'The team still controls the inbox' not in s
          assert 'you may add or replace the public contact email' in s
          assert 'However, if Otha’s account was the one involved in the earlier block' in s
          assert 'After your first event' not in s
          assert '1080 × 1350 px' in s and '1080 × 1920 px' in s
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/publish-final-onboarding.yml
      - name: Commit final presentation
        run: |
          git config user.name "ASC3ND Presentation Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/publish-final-onboarding.yml
          git commit -m "Publish final standalone onboarding presentation"
          git push
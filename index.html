<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASC3ND Collective — Facebook Page Onboarding</title><style>html,body{margin:0;background:#050505;color:#fff;font-family:system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}</style></head><body><main><p>Loading ASC3ND setup guide…</p></main><script src="/chunks/0.js"></script><script src="/chunks/1.js"></script><script src="/chunks/2.js"></script><script src="/chunks/3.js"></script><script src="/chunks/4.js"></script><script src="/chunks/5.js"></script><script src="/chunks/6.js"></script><script>try{if(!window.__parts||window.__parts.length!==7||window.__parts.some(x=>typeof x!=='string'))throw new Error('Missing presentation data');const b=atob(window.__parts.join('')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const h=new TextDecoder().decode(u);if(!h.startsWith('<!doctype html>')||!h.includes('ASC3ND Collective'))throw new Error('Invalid presentation data');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<main><div><h1>Unable to open the presentation</h1><p>Please refresh the page once. If the problem continues, contact the project team.</p></div></main>';console.error(e)}</script></body></html>

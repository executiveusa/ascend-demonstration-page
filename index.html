<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ASC3ND Collective — Facebook Page Onboarding</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:#050505}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050505}
main{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}
.card{width:min(620px,100%);padding:36px 28px;border:1px solid rgba(255,255,255,.16);border-radius:20px;background:#0d0d0d}
.mark{font-size:1.15rem;font-weight:900;letter-spacing:.08em}.mark span{color:#F5A617}
h1{font-size:clamp(1.7rem,5vw,2.8rem);line-height:1.05;margin:18px 0 10px}
p{color:#c9c5bc;line-height:1.6;margin:0}.bar{height:8px;border-radius:999px;background:#272727;margin:24px 0 0;overflow:hidden}
.bar i{display:block;width:42%;height:100%;border-radius:inherit;background:#F5A617;animation:move 1.1s ease-in-out infinite alternate}
button{margin-top:22px;border:0;border-radius:10px;background:#F5A617;color:#050505;font-weight:900;padding:13px 18px;cursor:pointer}
small{display:block;margin-top:14px;color:#8f8b83}
@keyframes move{to{transform:translateX(138%)}}
</style>
</head>
<body>
<main id="status"><div class="card"><div class="mark">ASC<span>3</span>ND COLLECTIVE</div><h1>Opening the setup guide</h1><p>Loading the verified guide from the <strong>main</strong> branch.</p><div class="bar"><i></i></div><small>This normally takes only a moment.</small></div></main>
<script>
(()=>{const COUNT=7,stamp=Date.now();
const providers=[
 i=>`https://raw.githubusercontent.com/executiveusa/ascend-demonstration-page/main/chunks/${i}.js?v=${stamp}`,
 i=>`https://cdn.jsdelivr.net/gh/executiveusa/ascend-demonstration-page@main/chunks/${i}.js?v=${stamp}`
];
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function loadPart(i){
 let last;
 for(const makeUrl of providers){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);
  try{
   const res=await fetch(makeUrl(i),{cache:"no-store",signal:ctl.signal,mode:"cors"});
   if(!res.ok)throw new Error(`HTTP ${res.status}`);
   const text=await res.text();
   const match=text.match(/window\.__parts\[(\d+)\]='([A-Za-z0-9+/=]+)'/);
   if(!match||Number(match[1])!==i)throw new Error("Invalid guide part");
   return match[2];
  }catch(err){last=err;await pause(150)}
  finally{clearTimeout(timer)}
 }
 throw new Error(`Part ${i+1} could not be loaded: ${last&&last.message?last.message:"network error"}`);
}
function fail(err){
 console.error(err);
 document.getElementById("status").innerHTML=`<div class="card"><div class="mark">ASC<span>3</span>ND COLLECTIVE</div><h1>The guide did not finish loading</h1><p>${String(err&&err.message||err).replace(/[<>&]/g,"")}</p><button type="button" onclick="location.reload()">Try again</button><small>No account information was changed.</small></div>`;
}
(async()=>{
 const parts=await Promise.all(Array.from({length:COUNT},(_,i)=>loadPart(i)));
 const joined=parts.join("");
 const binary=atob(joined),bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 const html=new TextDecoder("utf-8",{fatal:true}).decode(bytes);
 const required=["<!doctype html>","ASC3ND Collective — Facebook Page Onboarding","class=\"hero-logo\"","Step 1 of 7","Example only — please edit with your own words"];
 if(required.some(x=>!html.includes(x)))throw new Error("The guide package failed verification");
 if(html.includes("Unable to open the presentation")||html.includes("Instagram"))throw new Error("The guide package is not the approved final version");
 document.open();document.write(html);document.close();
})().catch(fail);
})();
</script>
</body>
</html>
